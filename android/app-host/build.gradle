plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

def appVersionCode = project.hasProperty('versionCode') ? project.property('versionCode').toInteger() : 5
def appVersionName = project.hasProperty('versionName') ? project.property('versionName').toString() : "1.1.0"

android {
    namespace 'com.cookoff.host'
    compileSdk 34

    defaultConfig {
        applicationId "com.cookoff.host"
        minSdk 21
        targetSdk 34
        versionCode appVersionCode
        versionName appVersionName
    }

    signingConfigs {
        release {
            storeFile file('../keystore/cookoff.jks')
            storePassword 'cookoffcontest'
            keyAlias 'cookoff'
            keyPassword 'cookoffcontest'
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.webkit:webkit:1.10.0'
    implementation 'androidx.activity:activity-ktx:1.8.2'
    implementation 'androidx.biometric:biometric:1.1.0'
}
