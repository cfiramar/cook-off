name: Build & Release Android APKs

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag Name (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'
      release_title:
        description: 'Release Title'
        required: true
        default: 'Cook-Off Apps Release'

permissions:
  contents: write

jobs:
  build-apks:
    name: Build Android TV & Host APKs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant Execute Permission to gradlew
        run: chmod +x android/gradlew

      - name: Build Android TV & Host APKs
        working-directory: android
        run: |
          ./gradlew :app-tv:assembleDebug :app-host:assembleDebug --no-daemon

      - name: Prepare APK Artifacts
        run: |
          mkdir -p release-apks
          cp android/app-tv/build/outputs/apk/debug/app-tv-debug.apk release-apks/CookOff-AndroidTV-ViewMode.apk
          cp android/app-host/build/outputs/apk/debug/app-host-debug.apk release-apks/CookOff-Host-Mobile.apk

      - name: Upload APKs as Workflow Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cookoff-apks
          path: release-apks/

      - name: Determine Tag
        id: vars
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ github.event.inputs.tag_name }}" >> $GITHUB_OUTPUT
            echo "title=${{ github.event.inputs.release_title }} (${{ github.event.inputs.tag_name }})" >> $GITHUB_OUTPUT
          else
            echo "tag=${{ github.ref_name }}" >> $GITHUB_OUTPUT
            echo "title=Cook-Off Release ${{ github.ref_name }}" >> $GITHUB_OUTPUT
          fi

      - name: Create GitHub Release with APKs
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.tag }}
          name: ${{ steps.vars.outputs.title }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            release-apks/CookOff-AndroidTV-ViewMode.apk
            release-apks/CookOff-Host-Mobile.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
