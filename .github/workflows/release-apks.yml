name: Build & Release Android APKs

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag Name (e.g. v1.0.2)'
        required: true
        default: 'v1.0.2'
      release_title:
        description: 'Release Title'
        required: true
        default: 'Cook-Off Apps Release'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build Android TV & Host APKs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Fix line endings and permissions for gradlew
        run: |
          sed -i 's/\r$//' android/gradlew
          chmod +x android/gradlew

      - name: Determine Tag and Title
        id: vars
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag_name }}"
            echo "tag=$TAG" >> $GITHUB_OUTPUT
            echo "title=${{ github.event.inputs.release_title }} ($TAG)" >> $GITHUB_OUTPUT
          else
            TAG="${{ github.ref_name }}"
            echo "tag=$TAG" >> $GITHUB_OUTPUT
            echo "title=Cook-Off Release $TAG" >> $GITHUB_OUTPUT
          fi
          # Strip leading 'v' for versionName
          VERSION_NAME="${TAG#v}"
          echo "version_name=$VERSION_NAME" >> $GITHUB_OUTPUT

      - name: Build Android TV & Host APKs (Release Signed)
        working-directory: android
        run: |
          ./gradlew :app-tv:assembleRelease :app-host:assembleRelease \
            -PversionCode=${{ github.run_number }} \
            -PversionName=${{ steps.vars.outputs.version_name }} \
            --no-daemon --stacktrace

      - name: Prepare APK Artifacts
        run: |
          mkdir -p release-apks
          cp android/app-tv/build/outputs/apk/release/app-tv-release.apk release-apks/CookOff-AndroidTV-ViewMode.apk
          cp android/app-host/build/outputs/apk/release/app-host-release.apk release-apks/CookOff-Host-Mobile.apk
          ls -la release-apks/

      - name: Upload APKs as Workflow Run Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: CookOff-APKs
          path: release-apks/
          retention-days: 30

      - name: Publish GitHub Release with APKs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.vars.outputs.tag }}"
          TITLE="${{ steps.vars.outputs.title }}"
          
          echo "Publishing release for tag: $TAG"
          
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release exists. Uploading APK assets..."
            gh release upload "$TAG" release-apks/CookOff-AndroidTV-ViewMode.apk release-apks/CookOff-Host-Mobile.apk --clobber
          else
            echo "Creating release $TAG..."
            gh release create "$TAG" release-apks/CookOff-AndroidTV-ViewMode.apk release-apks/CookOff-Host-Mobile.apk \
              --title "$TITLE" \
              --generate-notes
          fi
